services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusloop}
      POSTGRES_USER: ${POSTGRES_USER:-campusloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusloop_user} -d ${POSTGRES_DB:-campusloop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campusloop-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-campusloop_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-campusloop}
      - JWT_SECRET=${JWT_SECRET:?Error: JWT_SECRET must be set in .env}
      - AUTO_SEED=${AUTO_SEED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    networks:
      - campusloop-network
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - campusloop-network

volumes:
  postgres_data:

networks:
  campusloop-network:
    driver: bridge
