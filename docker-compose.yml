services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campusloop:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/data/campusloop.db
      - JWT_SECRET=${JWT_SECRET:-campusloop-development-secret-key-replace-in-production-min32chars}
      - AUTO_SEED=${AUTO_SEED:-true}
    volumes:
      - app_data:/app/data
    restart: unless-stopped

volumes:
  app_data:
