services:
  - type: web
    name: campusloop
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campusloop-db
          property: connectionString

databases:
  - name: campusloop-db
    plan: free
    region: oregon
    databaseName: campusloop
    user: campusloop_user
